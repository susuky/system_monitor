[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vital-tui"
version = "0.2.0"
description = "Linux 與 Windows 終端機系統資源監視器"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=7,<8",
    "textual>=6,<7",
    "nvidia-ml-py>=12,<14",
]

[project.scripts]
vital = "sysmon.cli:main"
sysmon = "sysmon.cli:main"

[project.urls]
Repository = "https://github.com/susuky/system_monitor"

[tool.setuptools.packages.find]
include = ["sysmon*"]
