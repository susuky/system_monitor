[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sysmon-tui"
version = "0.1.0"
description = "Linux 終端機系統資源監視器"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "psutil>=7,<8",
    "textual>=6,<7",
    "nvidia-ml-py>=12,<14",
]

[project.scripts]
sysmon = "sysmon.cli:main"

[project.urls]
Repository = "https://github.com/susuky/system_monitor"

[tool.setuptools.packages.find]
include = ["sysmon*"]
